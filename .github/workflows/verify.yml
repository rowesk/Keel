name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      KEEL_ALLOW_FOREGROUND_TESTS: "0"
      KEEL_RECORD_SNAPSHOTS: "0"
      TZ: Europe/London
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          sw_vers
          swift --version
          xcrun --show-sdk-version
      - name: Set the snapshot locale on this disposable runner
        run: |
          defaults write NSGlobalDomain AppleLocale -string en_GB
          defaults write NSGlobalDomain AppleLanguages -array en-GB
          swift -e 'import AppKit; print(Locale.current.identifier); print(TimeZone.current.identifier); print(["PalaceScriptMT-SemiBold", "SnellRoundhand-Bold"].map { ($0, NSFont(name: $0, size: 20) != nil) })'
      - name: Test and compare snapshots
        run: swift test --scratch-path "$RUNNER_TEMP/keel-tests" -Xswiftc -warnings-as-errors
      - name: Keep failed visual comparisons for review
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-snapshots
          path: Tests/KeelUITests/__Snapshots__/**/*.failed.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Compile release executable
        run: swift build --configuration release --scratch-path "$RUNNER_TEMP/keel-release" --product Keel -Xswiftc -warnings-as-errors
      - name: Check whitespace
        run: git diff --check

# Signing and notarization belong to a separately approved release job.
# This workflow uses no signing credentials and publishes no artifacts.
